name: Build APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'
          cache: gradle

      - name: Install Android NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_HOME/cmdline-tools/latest/bin/
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125"

      - name: Get npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "cachedir=$(npm config get cache)" >> ${GITHUB_OUTPUT}

      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: ${{ steps.npm-cache-dir.outputs.cachedir }}
          key: ${{ runner.os }}-npm-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-cache-

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: List APK Output
        if: always()
        run: |
          echo "=== All APK files ==="
          find android -name "*.apk" -type f 2>/dev/null || echo "No APK found"
          echo "=== app/build/outputs structure ==="
          find android/app/build/outputs -type f 2>/dev/null | head -30 || echo "No outputs dir"

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: android/build.log

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xxmusic-debug
          path: |
            android/app/build/outputs/apk/**/*.apk